type: custom:apexcharts-card
experimental:
  color_threshold: true
graph_span: 20h
header:
  show: false
series:
  - entity: sensor.climateoptimizer_compensated_outdoor_temperature
    color_threshold:
      - value: -5
        color: red
      - value: -3
        color: orange
      - value: -0.2
        color: lightblue
      - value: 0
        color: lightblue
      - value: 0.2
        color: lightgreen
      - value: 4
        color: darkgreen
        opacity: 1
    type: line
    name: Heater correction
    group_by:
      func: avg
      duration: 30min
  - entity: sensor.climateoptimizer_compensated_outdoor_temperature
    attribute: raw_outdoor_temp_c
    stroke_width: 2
    type: line
    name: Outside
    group_by:
      func: avg
      duration: 30min
  - entity: sensor.climateoptimizer_compensated_outdoor_temperature
    attribute: indoor_temp_c
    transform: >-
      return parseFloat(x) -
      parseFloat(hass.states['climate.house_climateoptimizer'].attributes.temperature);
    stroke_width: 2
    type: line
    name: Target
    group_by:
      func: avg
      duration: 60min
